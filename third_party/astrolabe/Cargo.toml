# Vendored third-party workspace.
#
# Upstream:  Astrolabe 0.17.0 (MIT OR Apache-2.0)
#            https://github.com/wojiushirencai/Astrolabe, tag v0.17.0,
#            commit e0be387b27129d5f70d724fcd19f74255c3a5aea.
# Source of truth: that tag. Re-vendoring means replacing `crates/` and this
# manifest, then re-applying the patches below (they are small and listed).
#
# Why vendored: Grok Build links `astrolabe-mcp` in-process as the engine behind
# the native `search_code` / `find_symbol` / `resolve_context` / `get_languages`
# tools. The `native` feature and the facade in
# `crates/astrolabe-mcp/src/native.rs` do not exist upstream, and a pinned copy
# keeps the MCP protocol dependency (`rmcp`) out of the tool contract while
# still reusing the ranking, pagination, body rendering and freshness barrier.
# See `astrolabe-native-search-code-plan.md` (workspace root) and
# `crates/codegen/xai-grok-astrolabe`.
#
# ============================================================================
# VENDORING NOTES — re-apply / re-bless ALL of the following on every upgrade:
# ============================================================================
# Local modifications to the upstream source:
#  1. `crates/astrolabe-mcp/Cargo.toml`: `[features] native = []`.
#  2. `crates/astrolabe-mcp/src/lib.rs`: `#[cfg(feature = "native")] pub mod
#     native;`.
#  3. `crates/astrolabe-mcp/src/native.rs` (new): in-process facade for all
#     seven tools plus index status / wait-ready / note-edited helpers. No
#     `rmcp` type appears in its public signatures.
#  4. `crates/astrolabe-mcp/src/server.rs`:
#     - `new_native()` / `new_native_configured()` / `new_native_with_lsp()` /
#       `new_native_with_options()` / `new_native_full()` (structured output
#       always on; watcher, built-in LSP, persistence and `.gitignore` policy
#       selectable) and `pub(crate)` accessors for index state, stats, leader
#       lock, root and `native_note_edited()`;
#     - `SearchParams.glob` (include glob) plus `build_include_set()` and the
#       two candidate filters that consume it.
#  5. `crates/astrolabe-mcp/src/session.rs`: `pub(crate) fn note_edited()`;
#     `scan_options()` keeps the cold build, inline repair and watcher on one
#     set of scan gates.
#  6. `crates/astrolabe-mcp/src/knobs.rs`: `McpKnobs.lsp_enabled`,
#     `persist_enabled` and `respect_gitignore`, plumbed through
#     `reindex::mcp_index_options()` and `session.rs`; env overrides
#     `ASTROLABE_PERSIST` / `ASTROLABE_RESPECT_GITIGNORE`.
#  7. Rustfmt applied to every touched file; no semantic change.
#  8. `crates/astrolabe-mcp/src/index.rs`: `text_only_paths` skips `.gitignore`
#     and `.ignore` (VCS pattern files); ripgrep hides dotfiles, so returning
#     them made `search_code` and `grep` disagree on the same literal. Unit
#     tests cover that and the `respect_gitignore = false` admitted set.
# ============================================================================

[workspace]
members = ["crates/astrolabe-core", "crates/astrolabe-mcp"]
resolver = "2"

[workspace.package]
version = "0.17.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Astrolabe Contributors"]
repository = "https://github.com/wojiushirencai/Astrolabe"
homepage = "https://github.com/wojiushirencai/Astrolabe"

# Pinned once here so 15 parallel tasks never fight over dependency versions.
# Do not add dependencies in member crates without adding them here first.
[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
globset = "0.4"
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
memchr = "2.7"
libc = "0.2"
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
encoding_rs = "0.8"
chardetng = "1.0"
notify = "8"
rayon = "1.10"
moka = { version = "0.12", features = ["sync"] }
redb = "4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Phase 2 (language-server routing) and Phase 3 (safe rewriting).
lsp-types = "0.97"
ast-grep-core = "0.45"

# Verified to share one ABI: grammars load under tree-sitter 0.27.0 (PHP LANGUAGE_PHP; C/C++ via tree-sitter-language).
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.24"
# Modern LanguageFn mode, isomorphic to php, verified under host tree-sitter 0.27.
tree-sitter-dart = "0.2"
# Modern LanguageFn mode, isomorphic to dart/php, verified under host tree-sitter 0.27.
tree-sitter-c-sharp = "0.23.5"
# LanguageFn mode, same host tree-sitter 0.27 contract as tree-sitter-c-sharp.
# tree-sitter is a dev-dependency of the crate only (tree-sitter-language ^0.1).
tree-sitter-vb-dotnet = "0.1.0"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# lang-batch-8 grammars (LanguageFn / tree-sitter-language mode, host tree-sitter 0.27).
tree-sitter-swift = "0.7"
tree-sitter-objc = "3.0"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-lua = "0.5"
# astrolabe-mcp. Caret (not `=`) so patch releases still apply.
# rmcp 3.4.0 is the floor because it implements MCP spec 2026-07-28
# (initialize is optional; per-request `_meta` is the new lifecycle).
rmcp = { version = "3.4.0", features = ["server", "transport-io", "schemars"] }
schemars = "1.2"
regex = "1.13"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }

# LSP installer (download / checksum / extract). Pinned for parallel tasks.
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"
zip = "9"
ureq = "3"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

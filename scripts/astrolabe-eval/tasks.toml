# Per-category run limits. Open-ended tasks legitimately need more turns and
# wall time than a single lookup; with the global cap they stop mid-answer and
# read as routing misses. A task-level `max_turns` / `timeout_s` key wins over
# its category entry.
[category_limits.task_start]
max_turns = 20
timeout_s = 600

[category_limits.wide_count]
max_turns = 20
timeout_s = 600

[category_limits.outside_workspace]
max_turns = 20
timeout_s = 600

[category_limits.languages]
max_turns = 16
timeout_s = 420

[category_limits.diagnostics]
max_turns = 16
timeout_s = 420

# File-type-filtered searches legitimately take a second pass when the first
# result is wide; 10 turns cut two of three glob samples mid-answer.
[category_limits.glob_type]
max_turns = 16
timeout_s = 420

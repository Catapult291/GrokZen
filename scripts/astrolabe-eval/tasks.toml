# Astrolabe tool-selection eval set (Phase 4 §10.3).
#
# Each task is one headless turn run against this repository. `expect` is the
# tool the routing matrix in the plan names as the first choice; `accept` also
# lists fallbacks that still solve the task. The runner records the first tool
# the model calls, the call list, turns, tokens and wall time for each arm.

[[task]]
id = "string_grep_timeout"
category = "known_string"
prompt = "Find the places that read GREP_TIMEOUT_WSL_SECS and show the enclosing function."
expect = "search_code"
accept = ["search_code", "grep"]

[[task]]
id = "string_refuse_index"
category = "known_string"
prompt = "Where is the message \"astrolabe refuses to index\" produced? Show the code around it."
expect = "search_code"
accept = ["search_code", "grep"]

[[task]]
id = "string_truncated_by_host"
